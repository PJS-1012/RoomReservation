upstream reservation_backend {
    # Avoid removing an instance from rotation after one transient connection failure.
    server app-1:8080 max_fails=3 fail_timeout=10s;
    server app-2:8080 max_fails=3 fail_timeout=10s;
}

log_format upstream_log '$remote_addr "$request" status=$status '
                        'upstream=$upstream_addr request_time=$request_time '
                        'upstream_response_time=$upstream_response_time';

access_log /var/log/nginx/access.log upstream_log;

server {
    listen 8080;

    location = /actuator/health {
        proxy_pass http://reservation_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://reservation_backend;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
