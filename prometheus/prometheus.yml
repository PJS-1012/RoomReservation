global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: room-reservation
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app-1:8080]
        labels:
          instance: app-1
      - targets: [app-2:8080]
        labels:
          instance: app-2

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
